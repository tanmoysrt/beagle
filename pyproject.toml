[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beagle"
version = "0.1.0"
description = "Contextual, self-improving AI code reviewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "watchfiles>=0.21",
    "sqlite-vec>=0.1.6",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
]

[project.scripts]
beagle = "beagle.cli:main"

[tool.setuptools.packages.find]
include = ["beagle*"]

[tool.setuptools.package-data]
beagle = ["storage/schema/*.sql", "prompts/defaults/*.md"]
