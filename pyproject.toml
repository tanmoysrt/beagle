[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beagle"
version = "0.1.0"
description = "Contextual, self-improving AI code reviewer"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.120",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "httpx>=0.28",
    "sqlite-vec>=0.1.9",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-go>=0.25",
]

[project.urls]
Homepage = "https://github.com/tanmoysrt/beagle"
Source = "https://github.com/tanmoysrt/beagle"
Issues = "https://github.com/tanmoysrt/beagle/issues"

[project.scripts]
beagle = "beagle.cli:main"

[tool.setuptools.packages.find]
include = ["beagle*"]

[tool.setuptools.package-data]
beagle = ["storage/schema/*/*.sql", "prompts/defaults/*.md"]
