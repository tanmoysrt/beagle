[server]
port = 8080
auth_tokens = ["CHANGE-ME"]
max_parallel_reviews = 5

[repo]
url = "https://github.com/acme/api"
default_base = "main"
ignore = []

[llm]
base_url = "https://openrouter.ai/api"
api_key = "PASTE-OPENROUTER-KEY"
[llm.headers]

# Two models. `reasoning` reads the code. `general` does the plan, the merge,
# the summary, and a reply to a comment. Both have to reason.
# This pair costs about one twelfth of claude-opus-5 with claude-sonnet-5, and
# it found more of the known problems. Refer to docs/configuration.md.
# Leave this section out and Beagle uses claude-opus-5 and claude-sonnet-5.
[llm.models]
reasoning = "z-ai/glm-5.2"
general = "deepseek/deepseek-v4-flash-0731"

[embeddings]
base_url = "https://openrouter.ai/api/v1"
api_key = "PASTE-OPENROUTER-KEY"
model = "text-embedding-3-large"
dims = 1024
batch_size = 128
[embeddings.headers]

# Optional. Beagle reviews pull requests when both keys have a value.
# [github]
# token = "github_pat_..."
# repo = "acme/api"

[review]
min_severity = "P5"
fail_on = "P1"
max_findings = 8
max_cost_usd = 2.50
token_budget = 60000

[context]
instruction_files = "auto"
instruction_files_extra = []
instruction_files_budget = 4000

[prompts]

[memory]
suppress_similarity = 0.92
downrank_similarity = 0.80
suppress_similarity_security = 0.97
