[server]
port = 8080
auth_tokens = ["CHANGE-ME"]
max_parallel_reviews = 5

[repo]
url = "https://github.com/acme/api"
default_base = "main"
ignore = []

[llm]
base_url = "https://openrouter.ai/api"
api_key = "PASTE-OPENROUTER-KEY"
# leave this out and two reviews of one change disagree
temperature = 0.0
[llm.headers]

# Two models. `reasoning` reads the code. `general` does the plan, the merge,
# the summary, and a reply to a comment. Both have to reason.
# This pair costs about one sixth of claude-sonnet-5 with claude-haiku-4-5.
# It finds fewer problems. Refer to docs/configuration.md for the measurement.
# Leave these sections out and Beagle uses claude-sonnet-5 and claude-haiku-4-5.
[llm.reasoning]
model = "z-ai/glm-5.2"
# One provider reads the conversation from its cache; a second reads it again
# at full price. Refer to docs/configuration.md.
[llm.reasoning.extra_body.provider]
order = ["z-ai"]
allow_fallbacks = false
quantizations = ["fp8"]

[llm.general]
model = "deepseek/deepseek-v4-flash-0731"

[embeddings]
base_url = "https://openrouter.ai/api/v1"
api_key = "PASTE-OPENROUTER-KEY"
# leave this out and two reviews of one change disagree
temperature = 0.0
model = "text-embedding-3-large"
dims = 1024
batch_size = 128
[embeddings.headers]

# Optional. Beagle reviews pull requests when both keys have a value.
# [github]
# token = "github_pat_..."
# repo = "acme/api"

[review]
min_severity = "P5"
fail_on = "P1"
max_findings = 12
min_confidence = 0.35
max_cost_usd = 2.50
token_budget = 250000

[context]
instruction_files = "auto"
instruction_files_extra = []
instruction_files_budget = 4000

[prompts]

[memory]
suppress_similarity = 0.92
downrank_similarity = 0.80
suppress_similarity_security = 0.97
